name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install clangd-14
        run: |
          sudo apt-get update
          sudo apt-get install -y clangd-14

      - name: Install mcp package
        run: pip install mcp

      - name: Run test suite
        run: python3 tests/run_tests.py -v
